name: JGrants Quick Eligibility

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/classify_snapshot.py"
      - ".github/workflows/jgrants_quick_classify.yml"

permissions:
  contents: write

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Build quick eligibility table
        run: python scripts/classify_snapshot.py
      - name: Commit quick table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eligibility_quick.csv data/eligibility_quick.md data/eligibility_quick_summary.json
          git commit -m "Update Jグランツ一次判定表" || exit 0
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Remote advanced during push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
