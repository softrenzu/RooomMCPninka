name: JGrants Export 45 History

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_eligible45.py"
      - ".github/workflows/jgrants_export_45.yml"
      - "data/eligibility_refined.csv"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export 45 candidates with history
        run: python scripts/export_eligible45.py
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eligible_45_history.md data/eligible_45_history.csv
          git commit -m "Export Jグランツ45件の過去ログ照合" || exit 0
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Remote advanced during push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
