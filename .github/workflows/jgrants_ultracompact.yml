name: JGrants Ultra Compact Review
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/make_ultracompact.py"
      - ".github/workflows/jgrants_ultracompact.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_ultracompact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_ultracompact.csv
          git commit -m "Compile compact 43件応募条件" || exit 0
          git push
