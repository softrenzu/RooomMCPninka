name: JGrants Review 43 Parallel

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_review_part.py"
      - ".github/workflows/jgrants_review_parallel.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        part: [1,2,3,4,5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Build packet
        env:
          PART: ${{ matrix.part }}
        run: python scripts/build_review_part.py
      - name: Commit packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/review_packets/packet_${{ matrix.part }}.json
          git commit -m "Review packet part ${{ matrix.part }}" || exit 0
          for i in 1 2 3; do git push && break || { git pull --rebase origin main; sleep 2; }; done
