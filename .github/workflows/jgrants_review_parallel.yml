name: JGrants Review 43 Parallel

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_review_part.py"
      - ".github/workflows/jgrants_review_parallel.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [1,2,3,4,5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Build packet
        env:
          PART: ${{ matrix.part }}
        run: python scripts/build_review_part.py
      - name: Commit packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_packets/packet_${{ matrix.part }}.json
          git commit -m "Review packet part ${{ matrix.part }}" || exit 0
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Remote advanced during push; retry ${attempt}/5"
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
